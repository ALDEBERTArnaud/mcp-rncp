name: Ingest data

on:
  schedule:
    - cron: "0 5 * * 1" # Monday 05:00 UTC
  workflow_dispatch:
    inputs:
      load_d1:
        description: "Load D1 (staging then production)"
        type: boolean
        default: true
      publish_release:
        description: "Publish GitHub Release data-YYYY-MM-DD"
        type: boolean
        default: true

concurrency:
  group: ingest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile

      - name: Fetch previous release (for change tracking)
        run: |
          set -e
          mkdir -p .data/prev
          TAG=$(gh release list --limit 50 --json tagName --jq '[.[].tagName | select(startswith("data-"))] | sort | last // empty')
          if [ -n "$TAG" ]; then
            echo "previous=$TAG"
            gh release download "$TAG" --pattern rncp.sqlite.br --dir .data/prev
            node -e "const z=require('zlib'),fs=require('fs');fs.writeFileSync('.data/prev/rncp.sqlite',z.brotliDecompressSync(fs.readFileSync('.data/prev/rncp.sqlite.br')))"
            echo "PREVIOUS_DB=.data/prev/rncp.sqlite" >> "$GITHUB_ENV"
          else
            echo "no previous data release"
          fi

      - name: Build rncp.sqlite / rncp.sql / manifest.json
        run: |
          set -e
          if [ -n "$PREVIOUS_DB" ]; then
            bun run --cwd packages/ingest ingest --data ../../.data --out ../../.data/out --previous "../../$PREVIOUS_DB"
          else
            bun run --cwd packages/ingest ingest --data ../../.data --out ../../.data/out
          fi
          cat .data/out/manifest.json
          echo "SOURCE_DATE=$(jq -r .source_date .data/out/manifest.json)" >> "$GITHUB_ENV"

      - name: Publish release data-${{ env.SOURCE_DATE }}
        if: ${{ github.event_name == 'schedule' || inputs.publish_release }}
        run: |
          set -e
          TAG="data-$SOURCE_DATE"
          NOTES="Export France compétences du $SOURCE_DATE (Licence Ouverte 2.0). $(jq -r '"\(.counts.total) fiches, \(.counts.actives) actives, \(.counts.blocs) blocs, \(.counts.partenaires) partenaires, \(.counts.changes) changements"' .data/out/manifest.json)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" .data/out/rncp.sqlite.br .data/out/manifest.json --clobber
          else
            gh release create "$TAG" .data/out/rncp.sqlite.br .data/out/manifest.json --title "Données RNCP/RS $SOURCE_DATE" --notes "$NOTES"
          fi

      - name: Load D1 staging
        if: ${{ github.event_name == 'schedule' || inputs.load_d1 }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run --cwd packages/ingest src/load-d1.ts --env staging --sql ../../.data/out/rncp.sql --expected-date "$SOURCE_DATE" --health https://staging.mcp-rncp.com/health

      - name: Load D1 production
        if: ${{ github.event_name == 'schedule' || inputs.load_d1 }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run --cwd packages/ingest src/load-d1.ts --env production --sql ../../.data/out/rncp.sql --expected-date "$SOURCE_DATE" --health https://mcp-rncp.com/health

      - name: Summary
        run: |
          {
            echo "## Ingest $SOURCE_DATE"
            echo '```json'
            cat .data/out/manifest.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
